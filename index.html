```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>CALL</title>

<style>

html, body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #080808;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;
}


/* =========================
   MAIN CALL AREA
   ========================= */

#callArea {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #080808;

    color: #777;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    cursor: pointer;
}


#label {

    font-size: 18vw;

    font-weight: 700;

    letter-spacing: 0.02em;

}


/* =========================
   CALLING STATE
   ========================= */

body.calling #callArea {

    background: #160a0a;

    color: #c98b8b;

}


/* =========================
   RESET BUTTON
   ========================= */

#reset {

    display: none;

    position: fixed;

    left: 50%;

    bottom: 5vh;

    transform: translateX(-50%);

    padding: 18px 45px;

    border: 2px solid #765050;

    border-radius: 18px;

    background: #211010;

    color: #c9a0a0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size: 4vw;

    font-weight: 600;

    cursor: pointer;

    z-index: 10;

}


/* Only show RESET while calling */

body.calling #reset {

    display: block;

}

</style>
</head>


<body>


<!-- =========================
     CALL AREA
     ========================= -->

<div id="callArea">

    <div id="label">CALL</div>

</div>


<!-- =========================
     CAREGIVER RESET
     ========================= -->

<button id="reset" type="button">
    RESET
</button>


<script>

const callArea = document.getElementById("callArea");

const reset = document.getElementById("reset");

const label = document.getElementById("label");


/* =========================
   DAD PRESSES CALL
   ========================= */

callArea.addEventListener("click", function() {

    /* Ignore if already calling */

    if (document.body.classList.contains("calling")) {
        return;
    }


    /* Change the screen */

    document.body.classList.add("calling");

    label.textContent = "CALLING";


    /* Start Apple Shortcut */

    window.location.href =
        "shortcuts://run-shortcut?name=CALL%20ALARM";

});


/* =========================
   CAREGIVER PRESSES RESET
   ========================= */

reset.addEventListener("click", function(event) {

    /*
       Stop this click from going anywhere else.
       It cannot activate CALL.
    */

    event.stopPropagation();


    /* Return to CALL state */

    document.body.classList.remove("calling");

    label.textContent = "CALL";

});


</script>

</body>
</html>

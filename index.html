<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>CALL</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #080808;

    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

#screen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #080808;
    color: #777;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    cursor: pointer;
}

/* Normal standby screen */

#label {
    font-size: 18vw;
    font-weight: 700;
    letter-spacing: 0.02em;
}


/* CALLING state */

#screen.calling {
    background: #160a0a;
    color: #c98b8b;
}


/* Caregiver reset button */

#reset {
    display: none;

    position: absolute;
    bottom: 5vh;
    left: 50%;

    transform: translateX(-50%);

    padding: 16px 34px;

    border: 2px solid #765050;
    border-radius: 18px;

    background: #211010;
    color: #b98f8f;

    font-size: 4vw;
    font-weight: 600;
}

#screen.calling #reset {
    display: block;
}

</style>
</head>

<body>

<div id="screen">

    <div id="label">CALL</div>

    <button id="reset" type="button">
        HOLD TO RESET
    </button>

</div>

<script>

const screen = document.getElementById("screen");
const label = document.getElementById("label");
const reset = document.getElementById("reset");

let resetTimer = null;


/* Dad activates CALL */

screen.addEventListener("click", function(event) {

    if (event.target === reset) {
        return;
    }

    if (screen.classList.contains("calling")) {
        return;
    }

    screen.classList.add("calling");
    label.textContent = "CALLING";

    window.location.href =
        "shortcuts://run-shortcut?name=CALL%20ALARM";
});


/* Caregiver holds RESET for 2 seconds */

function startReset() {

    resetTimer = setTimeout(function() {

        screen.classList.remove("calling");
        label.textContent = "CALL";

    }, 2000);
}


function cancelReset() {

    if (resetTimer !== null) {
        clearTimeout(resetTimer);
        resetTimer = null;
    }
}


reset.addEventListener("pointerdown", startReset);
reset.addEventListener("pointerup", cancelReset);
reset.addEventListener("pointercancel", cancelReset);
reset.addEventListener("pointerleave", cancelReset);

</script>

</body>
</html>

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>CALL</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;

    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

#screen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #080808;
    color: #777;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    cursor: pointer;
}

#label {
    font-size: 18vw;
    font-weight: 700;
    letter-spacing: 0.02em;
}


/* CALLING screen */

#screen.calling {
    background: #160a0a;
    color: #c98b8b;
}


/* Caregiver RESET button */

#reset {
    display: none;

    position: absolute;
    bottom: 5vh;
    left: 50%;
    transform: translateX(-50%);

    padding: 18px 40px;

    border: 2px solid #765050;
    border-radius: 18px;

    background: #211010;
    color: #c9a0a0;

    font-size: 4vw;
    font-weight: 600;

    cursor: pointer;
}

#screen.calling #reset {
    display: block;
}

</style>
</head>

<body>

<div id="screen">

    <div id="label">CALL</div>

    <button id="reset" type="button">
        RESET
    </button>

</div>


<script>

const screen = document.getElementById("screen");
const label = document.getElementById("label");
const reset = document.getElementById("reset");


/* =========================
   DAD ACTIVATES CALL
   ========================= */

screen.addEventListener("click", function(event) {

    /* If caregiver clicked RESET, don't trigger CALL */
    if (event.target === reset) {
        return;
    }

    /* Don't allow another call while already calling */
    if (screen.classList.contains("calling")) {
        return;
    }

    /* Change screen */

    screen.classList.add("calling");
    label.textContent = "CALLING";


    /* Start the Apple Shortcut */

    window.location.href =
        "shortcuts://run-shortcut?name=CALL%20ALARM";

});


/* =========================
   CAREGIVER RESET
   ========================= */

reset.addEventListener("click", function(event) {

    /* Prevent this click from reaching the CALL screen */

    event.stopPropagation();


    /* Return to normal CALL state */

    screen.classList.remove("calling");
    label.textContent = "CALL";

});

</script>

</body>
</html>
```

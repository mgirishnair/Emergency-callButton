```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>CALL</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

#screen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #080808;
    color: #777;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    cursor: pointer;
}

#label {
    font-size: 18vw;
    font-weight: 700;
    letter-spacing: 0.02em;
}

#screen.calling {
    background: #160a0a;
    color: #c98b8b;
}

#reset {
    display: none;

    position: absolute;
    bottom: 5vh;
    left: 50%;
    transform: translateX(-50%);

    padding: 16px 34px;

    border: 2px solid #765050;
    border-radius: 18px;

    background: #211010;
    color: #b98f8f;

    font-size: 4vw;
    font-weight: 600;

    touch-action: none;
}

#screen.calling #reset {
    display: block;
}
</style>
</head>

<body>

<div id="screen">

    <div id="label">CALL</div>

    <button id="reset" type="button">
        HOLD TO RESET
    </button>

</div>

<script>

const screen = document.getElementById("screen");
const label = document.getElementById("label");
const reset = document.getElementById("reset");

let resetTimer = null;


/* =========================
   DAD ACTIVATES CALL
   ========================= */

screen.addEventListener("click", function(event) {

    /* Ignore clicks on the reset button */
    if (event.target === reset) {
        return;
    }

    /* Ignore everything while already calling */
    if (screen.classList.contains("calling")) {
        return;
    }

    screen.classList.add("calling");
    label.textContent = "CALLING";

    window.location.href =
        "shortcuts://run-shortcut?name=CALL%20ALARM";
});


/* =========================
   CAREGIVER RESET
   ========================= */

function beginReset(event) {

    event.preventDefault();
    event.stopPropagation();

    /* Only allow reset while CALLING */
    if (!screen.classList.contains("calling")) {
        return;
    }

    /* Cancel any previous reset timer */
    if (resetTimer !== null) {
        clearTimeout(resetTimer);
        resetTimer = null;
    }

    /* Must hold for 2 seconds */
    resetTimer = setTimeout(function() {

        screen.classList.remove("calling");
        label.textContent = "CALL";

        resetTimer = null;

    }, 2000);
}


function cancelReset(event) {

    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    if (resetTimer !== null) {
        clearTimeout(resetTimer);
        resetTimer = null;
    }
}


/* Trackpad / mouse */

reset.addEventListener("mousedown", beginReset);
reset.addEventListener("mouseup", cancelReset);
reset.addEventListener("mouseleave", cancelReset);


/* Touchscreen */

reset.addEventListener("touchstart", beginReset, { passive: false });
reset.addEventListener("touchend", cancelReset, { passive: false });
reset.addEventListener("touchcancel", cancelReset, { passive: false });


/* Pointer events as an additional fallback */

reset.addEventListener("pointerdown", beginReset);
reset.addEventListener("pointerup", cancelReset);
reset.addEventListener("pointercancel", cancelReset);

</script>

</body>
</html>
